name: swarm-protocol
version: 1.0.1
description: "Swarm coordination semantics over Hermes Kanban + ByteRover, with a compatibility guard for dispatcher worker terminal Kanban tools and off-enum task statuses (NousResearch/hermes-agent#129021). No new protocol storage — Kanban cards and comments remain the durable state."
author: fleet
provides_tools:
  - swarm_request
  - swarm_verify
  - swarm_route
